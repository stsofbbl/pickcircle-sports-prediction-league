name: YOSO tests

on:
  push:
    branches:
      - codex/vercel-release-candidate
  pull_request:
    branches:
      - codex/vercel-release-candidate

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify phase3 visibility in isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the runner's preinstalled PostgreSQL; never connect to Supabase.
          sudo systemctl start postgresql.service
          sudo -u postgres createdb yoso_phase3_rls_test
          # postgres cannot traverse the runner's private checkout directory.
          stage_dir="$(mktemp -d /tmp/yoso-phase3.XXXXXX)"
          sudo chown postgres "$stage_dir"
          sudo install -D -o postgres -m 644 tests/sql/phase3-visibility.sql "$stage_dir/tests/sql/phase3-visibility.sql"
          sudo install -D -o postgres -m 644 tests/sql/phase3-rpc-integration.sql "$stage_dir/tests/sql/phase3-rpc-integration.sql"
          sudo install -D -o postgres -m 644 tests/sql/fixtures/phase3-production-functions.sql "$stage_dir/tests/sql/fixtures/phase3-production-functions.sql"
          sudo install -D -o postgres -m 644 tests/sql/fixtures/phase3-production-constraints.sql "$stage_dir/tests/sql/fixtures/phase3-production-constraints.sql"
          sudo install -D -o postgres -m 644 supabase/migrations/20261114123717_protect_phase3_prediction_visibility.sql "$stage_dir/supabase/migrations/20261114123717_protect_phase3_prediction_visibility.sql"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_phase3_rls_test -f "$stage_dir/tests/sql/phase3-visibility.sql"
          # The fixture must leave no relations or role after its ROLLBACK.
          test "$(sudo -u postgres psql -X -At -d yoso_phase3_rls_test -c "SELECT to_regclass('public.events') IS NULL AND NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('authenticated','anon'))")" = t
      - name: Verify admin-only online result finalization in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres createdb yoso_admin_finalize_mvp_test
          trap 'sudo -u postgres dropdb --if-exists yoso_admin_finalize_mvp_test' EXIT
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < tests/sql/koshien-admin-finalize-setup.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < tests/sql/fixtures/koshien-production-reopen.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < supabase/migrations/20261124000000_admin_finalize_koshien_results.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < supabase/migrations/20261124040000_protect_finalized_koshien_event_delete.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < supabase/migrations/20261124050000_reopen_archived_koshien_consistently.sql
          python3 scripts/verify-admin-finalize-concurrency.py yoso_admin_finalize_mvp_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d yoso_admin_finalize_mvp_test < tests/sql/koshien-admin-finalize-checks.sql
      - name: Verify Koshien cron gate in disposable PostgreSQL
        run: python3 scripts/verify-koshien-cron-gate.py
      - name: Run Koshien schedule and automation tests
        run: node --test tests/koshien-schedule-parser.test.js tests/koshien-schedule-sync.test.js tests/koshien-auto-sync.test.js
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          find js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify hosted connection in isolated Chrome
        shell: bash
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          curl --fail --silent --show-error --location --max-time 30 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js -o "$RUNNER_TEMP/yoso-supabase-sdk.js"
          node scripts/verify-supabase-browser.cjs "$RUNNER_TEMP/yoso-supabase-sdk.js"
      - name: Check Edge Functions
        run: |
          deno check --config supabase/functions/jhbf-results/deno.json supabase/functions/jhbf-results/index.ts
          deno check --config supabase/functions/jhbf-schedule/deno.json supabase/functions/jhbf-schedule/index.ts
          deno check --config supabase/functions/koshien-auto-sync/deno.json supabase/functions/koshien-auto-sync/index.ts
      - name: Verify pinned auto-sync deployment
        run: |
          deno check --config supabase/deployments/koshien-auto-sync/deno.json supabase/deployments/koshien-auto-sync/index.ts
          deno run --config supabase/deployments/koshien-auto-sync/deno.json scripts/verify-auto-sync-deployment.ts
      - name: Run all Node tests
        id: node-tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js tests/*.test.mjs > test-output.txt 2>&1
          status=$?
          tail -n 160 test-output.txt
          exit $status
      - name: Upload Node test output
        if: ${{ always() && steps.node-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: yoso-node-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Check whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
