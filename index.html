<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-title" content="YOSO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>YOSO</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-matte-2026.png" />
    <link rel="manifest" href="./manifest.json?v=splash-20260805-2" />
    <style>
      :root {
        color-scheme: dark;
        background: #050507;
        --startup-image: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050507;
      }

      .startup-splash {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: #050507;
      }

      .startup-splash::before {
        content: "";
        position: absolute;
        inset: -8%;
        background:
          linear-gradient(rgba(5, 5, 7, 0.42), rgba(5, 5, 7, 0.42)),
          var(--startup-image) center / cover no-repeat;
        filter: blur(24px) brightness(0.72);
        transform: scale(1.08);
      }

      .startup-splash img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .startup-splash img.is-ready {
        opacity: 1;
      }

      .startup-status {
        position: relative;
        z-index: 2;
        color: #f2a5bd;
        font: 700 17px/1.4 system-ui, -apple-system, sans-serif;
      }

      .startup-splash img.is-ready + .startup-status {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-splash img {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="startup-splash" aria-label="YOSOを起動しています">
      <img id="startupPoster" alt="YOSO 夏の甲子園2026 予想王決定戦" />
      <span class="startup-status">YOSOを起動しています…</span>
    </main>
    <script>
      (() => {
        const startedAt = performance.now();
        const target = new URL("./app.html", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash || "#home";
        const chunkUrls = [
          "./assets/splash/chunk-00.b64?v=20260805-2",
          "./assets/splash/chunk-01.b64?v=20260805-2",
          "./assets/splash/chunk-02.b64?v=20260805-2",
          "./assets/splash/chunk-03.b64?v=20260805-2",
          "./assets/splash/chunk-04.b64?v=20260805-2",
        ];
        let completed = false;

        const openApp = () => {
          if (completed) return;
          completed = true;
          const remaining = Math.max(0, 850 - (performance.now() - startedAt));
          window.setTimeout(() => window.location.replace(target.href), remaining);
        };

        const image = document.querySelector("#startupPoster");
        const imageReady = Promise.all(
          chunkUrls.map((url) => fetch(url, { cache: "force-cache" }).then((response) => {
            if (!response.ok) throw new Error(`Splash chunk failed: ${response.status}`);
            return response.text();
          })),
        ).then((chunks) => {
          const dataUri = `data:image/jpeg;base64,${chunks.join("").replace(/\s+/g, "")}`;
          document.documentElement.style.setProperty("--startup-image", `url("${dataUri}")`);
          image.src = dataUri;
          return image.decode ? image.decode() : Promise.resolve();
        }).then(() => image.classList.add("is-ready"));

        const appReady = fetch(`${target.pathname}${target.search}`, {
          credentials: "same-origin",
          cache: "no-cache",
        }).catch(() => undefined);

        Promise.allSettled([imageReady, appReady]).then(openApp);
        window.setTimeout(openApp, 2500);
      })();
    </script>
  </body>
</html>
