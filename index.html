<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-title" content="YOSO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>YOSO</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-matte-2026.png" />
    <link
      rel="apple-touch-startup-image"
      href="./assets/yoso-koshien-splash-1206x2622.jpg?v=20260805-1"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="./assets/yoso-koshien-splash-1206x2622.jpg?v=20260805-1"
    />
    <link rel="manifest" href="./manifest.json?v=splash-20260805-1" />
    <link
      rel="preload"
      as="image"
      href="./assets/yoso-koshien-splash-1206x2622.jpg?v=20260805-1"
      type="image/jpeg"
    />
    <style>
      :root {
        color-scheme: dark;
        background: #050507;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050507;
      }

      .startup-splash {
        position: fixed;
        inset: 0;
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: #050507;
      }

      .startup-splash::before {
        content: "";
        position: absolute;
        inset: -8%;
        background:
          linear-gradient(rgba(5, 5, 7, 0.38), rgba(5, 5, 7, 0.38)),
          url("./assets/yoso-koshien-splash-1206x2622.jpg?v=20260805-1") center / cover no-repeat;
        filter: blur(24px) brightness(0.72);
        transform: scale(1.08);
      }

      .startup-splash img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main class="startup-splash" aria-label="YOSOを起動しています">
      <img
        id="startupPoster"
        src="./assets/yoso-koshien-splash-1206x2622.jpg?v=20260805-1"
        alt="YOSO 夏の甲子園2026 予想王決定戦"
      />
    </main>
    <script>
      (() => {
        const startedAt = performance.now();
        const target = new URL("./app.html", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash || "#home";
        let completed = false;

        const openApp = () => {
          if (completed) return;
          completed = true;
          const remaining = Math.max(0, 420 - (performance.now() - startedAt));
          window.setTimeout(() => window.location.replace(target.href), remaining);
        };

        const image = document.querySelector("#startupPoster");
        const imageReady = image?.decode ? image.decode().catch(() => undefined) : Promise.resolve();
        const appReady = fetch(`${target.pathname}${target.search}`, {
          credentials: "same-origin",
        }).catch(() => undefined);

        Promise.allSettled([imageReady, appReady]).then(openApp);
        window.setTimeout(openApp, 1800);
      })();
    </script>
  </body>
</html>
